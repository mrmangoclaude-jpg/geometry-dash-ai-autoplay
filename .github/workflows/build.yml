name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: 'v5.11.1'
          target: ${{ matrix.config.target }}
          combine: true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIAutoPlay-Geode-Mod
          path: build/geode-build/*.geode
